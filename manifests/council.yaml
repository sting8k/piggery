# council: the chair asks independent members about one decision and gives the Human the verdict.
# Every role talks with `send`; routing is the fence: a member reaches only the chair, so members
# cannot see each other.
template: council
summary: "Read-only: a chair asks independent members, each through one lens, about one hard decision and gives the verdict."
auto_join_role: chair   # the founder's role when a session founds a team from this template
taskforce:             # a solo or a gate can also call this up for one job (spawn template=), as a headless team
  idle_for: 20m          # when every member has been idle this long, the caller gets one notice
roles:
  chair:
    description: Writes a neutral brief, gets independent opinions, questions them, and gives the verdict.
    instructions_file: prompts/council/chair.md
    tools: [send, inbox, who, agent]
    can_spawn: [member]
    can_pin: false
    can_set_cwd: false
    spawn:                 # how piggery starts this role's workers
      harness: inherit       # inherit: the main session's harness, else config.yaml harness
      model: inherit         # inherit: harness profile, else the main session's (same harness), else harness default
      thinking: inherit      # inherit: same chain as model
      allow_tools: []      # native tools the harness profile turns off that this role keeps
  member:
    description: Answers the chair's brief through one lens, with evidence, without seeing the others.
    instructions_file: prompts/council/member.md
    tools: [send, inbox, who]
    can_spawn: []
    can_pin: false
    can_set_cwd: false
    spawn:                 # how piggery starts this role's workers
      harness: inherit       # inherit: the main session's harness, else config.yaml harness
      model: inherit         # inherit: harness profile, else the main session's (same harness), else harness default
      thinking: inherit      # inherit: same chain as model
      allow_tools: []      # native tools the harness profile turns off that this role keeps
routing:
  - {from: chair, to: member, allow: true, cc: []}
  - {from: member, to: chair, allow: true, cc: []}
timers:
  - {on: member, notify: reports_to, silent_for: 20m}
limits:                  # none: no limit
  depth: 2                 # how deep spawned_by chains may go
  concurrency: 10           # live workers at once
  messages_per_participant_per_minute: 30
  max_respawn_per_hour: none
